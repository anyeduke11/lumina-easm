<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Lumina · 烛隐 EASM —— 互联网敏感信息过度泄露排查平台</title>
  <desc id="heroDesc">五阶段外部攻击面管理流水线：搜索引擎、空间测绘、端口目录、第三方渠道、暗网；证据先行、零误报闭环、授权一票否决。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0E1528"/>
    </linearGradient>
    <linearGradient id="cyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bgGrad)"/>
  <line x1="684" y1="62" x2="684" y2="360" stroke="#1B2337" stroke-width="1.5"/>

  <!-- 左侧：标题区 -->
  <g transform="translate(56 40)">
    <text x="0" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#8B94AB" letter-spacing="3">EXTERNAL ATTACK SURFACE MANAGEMENT</text>
    <text x="0" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="82" font-weight="700" fill="#E6EDF7">Lumina</text>
    <text x="0" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="42" font-weight="600" fill="url(#cyGrad)">烛隐 EASM</text>
    <text x="0" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="23" fill="#C7CFDF">五阶段互联网敏感信息过度泄露排查平台：</text>
    <text x="0" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="23" fill="#C7CFDF">证据先行 · 零误报闭环 · 授权一票否决</text>
    <text x="0" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8B94AB">Go 1.24 · net/http 零框架 · console 零依赖纯静态 · v0.0.1</text>
    <text x="0" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8B94AB">双后端：内存 MemStore ↔ PostgreSQL（RLS 行级租户隔离）</text>
  </g>

  <!-- 右侧：五阶段巡检流水线 -->
  <g transform="translate(712 40)">
    <text x="0" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#8B94AB">五阶段巡检流水线</text>

    <!-- P1 -->
    <rect x="0" y="52" width="452" height="46" rx="10" fill="#101A30" stroke="#232B40"/>
    <rect x="12" y="62" width="34" height="26" rx="6" fill="#101A30" stroke="#2DD4BF"/>
    <text x="29" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2DD4BF" text-anchor="middle">P1</text>
    <text x="60" y="81" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" fill="#E6EDF7">搜索引擎</text>
    <text x="452" y="81" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8B94AB" text-anchor="end">search</text>
    <path d="M226 98 l8 9 l-8 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- P2 -->
    <rect x="0" y="116" width="452" height="46" rx="10" fill="#101A30" stroke="#232B40"/>
    <rect x="12" y="126" width="34" height="26" rx="6" fill="#101A30" stroke="#2DD4BF"/>
    <text x="29" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2DD4BF" text-anchor="middle">P2</text>
    <text x="60" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" fill="#E6EDF7">空间测绘</text>
    <text x="452" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8B94AB" text-anchor="end">footprint</text>
    <path d="M226 162 l8 9 l-8 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- P3 -->
    <rect x="0" y="180" width="452" height="46" rx="10" fill="#101A30" stroke="#232B40"/>
    <rect x="12" y="190" width="34" height="26" rx="6" fill="#101A30" stroke="#2DD4BF"/>
    <text x="29" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2DD4BF" text-anchor="middle">P3</text>
    <text x="60" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" fill="#E6EDF7">端口目录</text>
    <text x="452" y="209" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8B94AB" text-anchor="end">scan</text>
    <path d="M226 226 l8 9 l-8 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- P4 -->
    <rect x="0" y="244" width="452" height="46" rx="10" fill="#101A30" stroke="#232B40"/>
    <rect x="12" y="254" width="34" height="26" rx="6" fill="#101A30" stroke="#2DD4BF"/>
    <text x="29" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#2DD4BF" text-anchor="middle">P4</text>
    <text x="60" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" fill="#E6EDF7">第三方渠道</text>
    <text x="452" y="273" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8B94AB" text-anchor="end">market</text>
    <path d="M226 290 l8 9 l-8 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- P5 暗网：授权一票否决 -->
    <rect x="0" y="308" width="452" height="46" rx="10" fill="#2A0F1A" stroke="#F43F5E"/>
    <rect x="12" y="318" width="34" height="26" rx="6" fill="#2A0F1A" stroke="#F43F5E"/>
    <text x="29" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#F43F5E" text-anchor="middle">P5</text>
    <text x="60" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" fill="#FECDD3">暗网兜底</text>
    <text x="452" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#F43F5E" text-anchor="end">授权一票否决</text>
  </g>
</svg>
