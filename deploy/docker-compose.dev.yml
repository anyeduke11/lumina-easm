# M0 开发环境（WP-M0-03 部分）：PG / Redis / Neo4j
# 其余组件（OpenSearch / ClickHouse / MinIO / Temporal / vLLM）在对应工作包落地时加入
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: easm-***
      POSTGRES_DB: easm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/easm-***
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
